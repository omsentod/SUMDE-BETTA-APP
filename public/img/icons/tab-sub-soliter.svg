<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="soliterGlass" x1="10" y1="12" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="soliterWater" x1="10" y1="20" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Nano Cube Rimless Soliter Tank Glass Body -->
  <rect x="9" y="10" width="30" height="28" rx="3.5" fill="url(#soliterGlass)" stroke="#38BDF8" stroke-width="1.4"/>

  <!-- Water Volume Fill -->
  <path d="M10 18C15 16.5 23 19.5 28 18C33 16.5 35 18 38 18V35C38 36.65 36.65 38 35 38H13C11.35 38 10 36.65 10 35V18Z" fill="url(#soliterWater)"/>
  <!-- Water Surface Line -->
  <path d="M10 18C15 16.5 23 19.5 28 18C33 16.5 35 18 38 18" stroke="#BAE6FD" stroke-width="1.2" stroke-linecap="round"/>

  <!-- High-End Optical Glass Glare Highlights -->
  <path d="M13 13L13 34" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
  <path d="M16 13L16 22" stroke="#FFFFFF" stroke-width="0.75" stroke-linecap="round" opacity="0.4"/>

  <!-- Tiny Swimming Betta Silhouette inside tank -->
  <path d="M26 27C24 25 21 26 19 25C21 28 24 29 26 27Z" fill="#FF6B35"/>
  <path d="M19 25C17 23 15 24 16 26C17 27 18 26 19 25Z" fill="#FBBF24"/>

  <!-- Rising Micro Bubbles -->
  <circle cx="31" cy="24" r="1.4" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="33" cy="29" r="1.1" fill="#BAE6FD" opacity="0.85"/>
  <circle cx="28" cy="32" r="1.3" fill="#FFFFFF" opacity="0.75"/>

  <!-- Modern Dark Wood Tank Pedestal / Mat Base -->
  <rect x="7" y="38" width="34" height="3" rx="1.5" fill="#334155" stroke="#1E293B" stroke-width="0.8"/>
</svg>
