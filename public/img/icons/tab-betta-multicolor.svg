<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <!-- Tail Fin (Caudal) Multicolor Gradient -->
    <linearGradient id="bettaTailGrad" x1="16" y1="24" x2="4" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="25%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="75%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Dorsal Fin Gradient -->
    <linearGradient id="bettaDorsalGrad" x1="24" y1="18" x2="14" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="40%" stop-color="#DC2626"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Anal Fin Gradient -->
    <linearGradient id="bettaAnalGrad" x1="26" y1="28" x2="16" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="35%" stop-color="#EA580C"/>
      <stop offset="70%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Body Multicolor Koi Shading -->
    <linearGradient id="bettaBodyGrad" x1="18" y1="26" x2="42" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="28%" stop-color="#2563EB"/>
      <stop offset="55%" stop-color="#F97316"/>
      <stop offset="82%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Ventral Long Whiskers Gradient -->
    <linearGradient id="bettaVentralGrad" x1="30" y1="28" x2="26" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="60%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Scale Shimmer Highlight -->
    <radialGradient id="bettaGleam" cx="34" cy="21" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Large Caudal Fin (Halfmoon Multicolor Fan) -->
  <path d="M19 22C16 17 9 10 3 13C-1 15 1 23 2 26C3 31 1 37 5 39C10 41 15 34 19 26Z" fill="url(#bettaTailGrad)" />
  <!-- Caudal Fin Rays (Delicate fin ray accents) -->
  <path d="M19 24C12 20 6 15 3 14M19 24C10 24 4 23 2 26M19 25C11 28 6 34 5 38" stroke="rgba(255,255,255,0.4)" stroke-width="0.75" stroke-linecap="round"/>

  <!-- Dorsal Fin (Top Flowing Crown) -->
  <path d="M22 17C19 12 16 6 12 7C9 8 11 13 13 16C15 19 18 19 23 18Z" fill="url(#bettaDorsalGrad)"/>
  <path d="M20 17C17 12 14 8 12 7" stroke="rgba(255,255,255,0.4)" stroke-width="0.75" stroke-linecap="round"/>

  <!-- Anal Fin (Bottom Flaring Curtain) -->
  <path d="M20 27C17 32 15 38 18 41C21 43 24 37 28 32C29 30 25 28 20 27Z" fill="url(#bettaAnalGrad)"/>
  <path d="M21 28C19 33 18 38 18 41M25 29C23 34 22 37 23 39" stroke="rgba(255,255,255,0.35)" stroke-width="0.65" stroke-linecap="round"/>

  <!-- Pectoral Long Ventral Fin (Betta Drip Fins) -->
  <path d="M29 27C27 33 25 40 27 43C27.6 43 28.5 39 30 33C31 29 30 27 29 27Z" fill="url(#bettaVentralGrad)"/>

  <!-- Main Betta Muscular Body (Sleek Plakat/Halfmoon Curvature) -->
  <path d="M17 24C18 20 23 16 30 16C37 16 43 19 45 22C46 23.5 44 25.5 41 27C36 29.5 29 30 24 28C19 26.5 17 25 17 24Z" fill="url(#bettaBodyGrad)"/>

  <!-- Koi Color Patches / Multicolor Patterns on Body -->
  <!-- Dark Blue Galaxy Patch -->
  <path d="M21 23C23 20 27 18 29 19C27 23 23 25 21 23Z" fill="#1E3A8A" opacity="0.85"/>
  <!-- Bright Koi Red Patch -->
  <path d="M28 22C31 18 35 18 37 20C35 24 30 25 28 22Z" fill="#DC2626"/>
  <!-- Pure White Marble Patch -->
  <path d="M33 21C35 19 38 20 39 21C38 23 34 24 33 21Z" fill="#FFFFFF" opacity="0.9"/>
  <!-- Gold / Amber Sparkle Flecks -->
  <circle cx="26" cy="21" r="0.9" fill="#FBBF24"/>
  <circle cx="31" cy="24" r="0.8" fill="#FBBF24"/>
  <circle cx="35" cy="22" r="0.9" fill="#FDE68A"/>

  <!-- Body Glow Highlight -->
  <ellipse cx="33" cy="21" rx="6" ry="2.5" fill="url(#bettaGleam)"/>

  <!-- Gill Cover / Operculum Arc -->
  <path d="M38 19C39.5 21 39.5 24 38 26" stroke="#991B1B" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Pectoral Flaring Front Fin (Transparent Iridescent) -->
  <path d="M36 24C34 27 32 30 34 31C36 31 38 28 38 25Z" fill="#38BDF8" fill-opacity="0.75" stroke="#FFFFFF" stroke-width="0.5"/>

  <!-- Eye (Glossy Betta Eye) -->
  <circle cx="42" cy="21" r="2.2" fill="#0F172A"/>
  <circle cx="42" cy="21" r="1.8" fill="#1E293B"/>
  <circle cx="42.3" cy="20.7" r="1.1" fill="#F59E0B"/>
  <circle cx="42.5" cy="20.5" r="0.6" fill="#09090B"/>
  <!-- Eye Light Catch Point -->
  <circle cx="42.9" cy="20.1" r="0.45" fill="#FFFFFF"/>

  <!-- Cute Mouth Line -->
  <path d="M45.5 23C44.5 23.5 44 24 43.5 24" stroke="#7F1D1D" stroke-width="0.7" stroke-linecap="round"/>
</svg>
