<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <!-- Channa Sail Dorsal Fin Gradient -->
    <linearGradient id="channaDorsal" x1="12" y1="12" x2="38" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="70%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Channa Body (Copper/Gold Predatory Body) -->
    <linearGradient id="channaBody" x1="8" y1="24" x2="44" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="25%" stop-color="#78350F"/>
      <stop offset="55%" stop-color="#D97706"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Caudal Fan Gradient -->
    <linearGradient id="channaTail" x1="14" y1="25" x2="2" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0891B2"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="channaAnal" x1="14" y1="31" x2="34" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="50%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- High Crest Long Dorsal Fin (Iconic Channa Fin) -->
  <path d="M12 21C14 13 22 9 34 11C35 11 36 12 36 13C36 15 32 17 28 18C23 19 16 21 12 21Z" fill="url(#channaDorsal)" stroke="#0891B2" stroke-width="0.8"/>
  <!-- Dorsal Fin Bar Rays -->
  <path d="M15 17L17 12M20 18L22 11M25 18L27 11M30 18L32 12" stroke="#083344" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Neon Turquoise Fin Outer Rim -->
  <path d="M12 21C14 13 22 9 34 11" stroke="#67E8F9" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Round Caudal Fin (Tail with Rim Rings) -->
  <path d="M11 23C7 19 2 20 2 25C2 30 7 31 11 27Z" fill="url(#channaTail)"/>
  <path d="M4 22C6 24 6 26 4 28" stroke="#FDE68A" stroke-width="1" stroke-linecap="round"/>
  <path d="M2.5 23C3.5 24 3.5 26 2.5 27" stroke="#67E8F9" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Long Lower Anal Fin -->
  <path d="M13 28C16 35 25 36 33 30C32 28 26 27 20 27L13 28Z" fill="url(#channaAnal)"/>
  <path d="M15 30C20 35 28 35 33 30" stroke="#67E8F9" stroke-width="1" stroke-linecap="round"/>

  <!-- Sleek Snakehead Body (Elongated Powerful Torpedo) -->
  <path d="M10 25C11 21 17 18 26 18C34 18 42 19 45 23C46 24.5 44 27 40 28C34 30 22 30 14 28C11 27.5 10 26 10 25Z" fill="url(#channaBody)"/>

  <!-- Channa Auranti / Barca Tiger Chevron Stripes -->
  <path d="M17 21L19 27M21 20L24 27M26 20L29 27M31 20L34 26" stroke="#451A03" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M18.5 22L20.5 26M23.5 21L25.5 26M28.5 21L30.5 26" stroke="#FDE68A" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Ventral Golden Leopard Spots -->
  <circle cx="16" cy="26" r="0.8" fill="#FEF08A"/>
  <circle cx="21" cy="27" r="0.8" fill="#FEF08A"/>
  <circle cx="26" cy="27.5" r="0.8" fill="#FEF08A"/>
  <circle cx="31" cy="27" r="0.8" fill="#FEF08A"/>

  <!-- Pectoral Paddle Fin (Fan like with orange ring) -->
  <path d="M33 24C32 27 31 31 33 32C35 32 37 28 36 25Z" fill="#D97706" stroke="#FEF08A" stroke-width="0.8"/>

  <!-- Gill Flap Curve -->
  <path d="M38 20C40 22 40 26 37 28" stroke="#451A03" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Intense Predatory Channa Eye (Red & Gold) -->
  <circle cx="42" cy="22" r="2.2" fill="#0C0A09"/>
  <circle cx="42" cy="22" r="1.7" fill="#DC2626"/>
  <circle cx="42.3" cy="21.7" r="1.1" fill="#FEF08A"/>
  <circle cx="42.5" cy="21.5" r="0.6" fill="#000000"/>
  <circle cx="42.8" cy="21.2" r="0.4" fill="#FFFFFF"/>

  <!-- Lower Jaw / Snakehead Lip -->
  <path d="M45.5 23.5C44 24.5 42 25 41 25" stroke="#78350F" stroke-width="0.9" stroke-linecap="round"/>
</svg>