<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hobFilter" x1="14" y1="10" x2="34" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="bioWater" x1="16" y1="20" x2="32" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Filter Housing Box -->
  <rect x="12" y="8" width="24" height="28" rx="4" fill="url(#hobFilter)" stroke="#7DD3FC" stroke-width="1.2"/>
  <!-- Clear View Window -->
  <rect x="16" y="12" width="16" height="12" rx="2" fill="#BAE6FD" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="0.8"/>

  <!-- Water Inlet Pipe Left -->
  <path d="M16 8V5C16 3.9 16.9 3 18 3H22C23.1 3 24 3.9 24 5V8" fill="#0369A1" stroke="#38BDF8" stroke-width="1"/>
  <!-- Pipe Extension Tube into Water -->
  <rect x="18" y="28" width="4" height="15" rx="1" fill="#0284C7" stroke="#38BDF8" stroke-width="0.8"/>
  <rect x="17" y="41" width="6" height="4" rx="1.5" fill="#334155"/>

  <!-- Water Waterfall Outflow Lip on Right -->
  <path d="M28 20H38C39.1 20 40 20.9 40 22V25C40 25.6 39.6 26 39 26H28V20Z" fill="#38BDF8"/>
  <!-- Waterfall Cascade Spout -->
  <path d="M36 26C36 29 35 34 33 37C34.5 37.5 37 37 38 34C39 31 39.5 28 39 26H36Z" fill="url(#bioWater)" opacity="0.9"/>

  <!-- Swirling Bio-Rings inside chamber -->
  <circle cx="21" cy="18" r="2.2" stroke="#FFFFFF" stroke-width="1.2" fill="none"/>
  <circle cx="27" cy="18" r="2.2" stroke="#FEF08A" stroke-width="1.2" fill="none"/>

  <!-- Rising Aeration Micro Bubbles -->
  <circle cx="10" cy="36" r="1.8" fill="#38BDF8"/>
  <circle cx="7" cy="28" r="1.3" fill="#BAE6FD"/>
  <circle cx="9" cy="22" r="1.6" fill="#38BDF8"/>
  <circle cx="6" cy="16" r="1.1" fill="#BAE6FD"/>
</svg>