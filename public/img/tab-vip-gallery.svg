<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <!-- Royal 24K Gold Gradient -->
    <linearGradient id="vipGoldGrad" x1="12" y1="12" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Diamond Core Gradient -->
    <linearGradient id="diamondGrad" x1="20" y1="18" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Radiance Aura -->
    <radialGradient id="vipGlow" cx="24" cy="24" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Luminous Gold Glow Aura -->
  <circle cx="24" cy="24" r="20" fill="url(#vipGlow)"/>

  <!-- 4-Point Brilliant Starburst Behind Crown -->
  <path d="M24 2L26 18L42 20L26 22L24 38L22 22L6 20L22 18L24 2Z" fill="#FDE68A" opacity="0.4"/>

  <!-- Royal Exhibition Masterpiece Crown -->
  <path d="M8 34L11 20L19 26L24 14L29 26L37 20L40 34H8Z" fill="url(#vipGoldGrad)" stroke="#B45309" stroke-width="0.8"/>

  <!-- Crown Bejeweled Pearl Tips -->
  <circle cx="11" cy="19" r="2.2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="0.6"/>
  <circle cx="19" cy="25" r="1.8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="0.6"/>
  <circle cx="24" cy="13" r="2.6" fill="#FFFFFF" stroke="#D97706" stroke-width="0.8"/>
  <circle cx="29" cy="25" r="1.8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="0.6"/>
  <circle cx="37" cy="19" r="2.2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="0.6"/>

  <!-- Central Diamond Gem Facet -->
  <polygon points="24,20 28,26 24,31 20,26" fill="url(#diamondGrad)" stroke="#B45309" stroke-width="0.6"/>
  <line x1="20" y1="26" x2="28" y2="26" stroke="#FFFFFF" stroke-width="0.6"/>

  <!-- Crown Base Ribbon / Rim with Precious Inset Gems -->
  <rect x="7" y="34" width="34" height="5" rx="2" fill="#B45309" stroke="#78350F" stroke-width="0.8"/>
  <rect x="8.5" y="35" width="31" height="3" rx="1.5" fill="#F59E0B"/>
  <circle cx="14" cy="36.5" r="1.2" fill="#FFFFFF"/>
  <circle cx="24" cy="36.5" r="1.4" fill="#FFFFFF"/>
  <circle cx="34" cy="36.5" r="1.2" fill="#FFFFFF"/>

  <!-- Sparkle Stars -->
  <path d="M39 9L40 12L43 13L40 14L39 17L38 14L35 13L38 12L39 9Z" fill="#FEF08A"/>
  <path d="M9 11L9.7 13.3L12 14L9.7 14.7L9 17L8.3 14.7L6 14L8.3 13.3L9 11Z" fill="#FEF08A"/>
</svg>