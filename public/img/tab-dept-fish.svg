<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <!-- Coral Red/Orange Betta Gradient -->
    <linearGradient id="deptFishOrange" x1="14" y1="14" x2="36" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Cyan/Blue Aquatic Betta Gradient -->
    <linearGradient id="deptFishCyan" x1="34" y1="34" x2="12" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Subtle Water Ring Glow -->
    <linearGradient id="deptWaterGlow" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Water Ring Backdrop -->
  <circle cx="24" cy="24" r="22" fill="url(#deptWaterGlow)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Aquatic Ripple Rings -->
  <circle cx="24" cy="24" r="18" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="0.75" stroke-dasharray="3 3"/>

  <!-- Top Fish (Vibrant Orange Coral Swimming Right) -->
  <!-- Tail -->
  <path d="M12 20C8 16 5 12 7 10C10 7 13 13 17 17Z" fill="#F97316" opacity="0.9"/>
  <!-- Body -->
  <path d="M15 18C18 13 25 10 32 12C36 13 38 15 39 17C38 19 33 21 26 21C20 21 16 20 15 18Z" fill="url(#deptFishOrange)"/>
  <!-- Dorsal Fin -->
  <path d="M22 12C20 8 16 6 15 7C16 10 19 12 22 12Z" fill="#FBBF24"/>
  <!-- Ventral -->
  <path d="M26 21C24 25 23 27 24 28C25 28 26 25 28 21Z" fill="#EF4444"/>
  <!-- Eye -->
  <circle cx="36" cy="15.5" r="1.3" fill="#0F172A"/>
  <circle cx="36.3" cy="15.2" r="0.4" fill="#FFFFFF"/>

  <!-- Bottom Fish (Cyan / Blue Swimming Left in Harmony) -->
  <!-- Tail -->
  <path d="M36 28C40 32 43 36 41 38C38 41 35 35 31 31Z" fill="#0284C7" opacity="0.9"/>
  <!-- Body -->
  <path d="M33 30C30 35 23 38 16 36C12 35 10 33 9 31C10 29 15 27 22 27C28 27 32 28 33 30Z" fill="url(#deptFishCyan)"/>
  <!-- Dorsal Fin -->
  <path d="M26 36C28 40 32 42 33 41C32 38 29 36 26 36Z" fill="#38BDF8"/>
  <!-- Ventral -->
  <path d="M22 27C24 23 25 21 24 20C23 20 22 23 20 27Z" fill="#00B4D8"/>
  <!-- Eye -->
  <circle cx="12" cy="32.5" r="1.3" fill="#0F172A"/>
  <circle cx="11.7" cy="32.2" r="0.4" fill="#FFFFFF"/>

  <!-- Center Floating Oxygen Pearls / Water Bubbles -->
  <circle cx="24" cy="24" r="1.8" fill="#FFFFFF" fill-opacity="0.8"/>
  <circle cx="21" cy="20" r="1" fill="#38BDF8" fill-opacity="0.7"/>
  <circle cx="27" cy="28" r="1.2" fill="#FFD166" fill-opacity="0.8"/>
</svg>